<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Guardlings</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Guardlings">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<script>
  // Загрузка игры. Чтобы браузер не показывал старую версию из кеша, сначала без кеша читается
  // version.json (номер сборки, меняется при каждой публикации), и все файлы игры запрашиваются
  // с этим номером в адресе (?v=…). Новая сборка — новые адреса — браузер обязан скачать заново.
  // С диска (двойной щелчок) кеша нет: файлы грузятся как есть, картинки — встроенные в код.
  const disk = location.protocol === 'file:';
  const FILES = ['vendor/phaser.min.js', 'src/platform.js', 'src/i18n.js', 'src/config.js', 'src/audio.js', 'src/ui.js', 'src/scenery.js']
    .concat(disk ? ['src/sprites.js', 'src/portraits.js', 'src/art.js'] : ['src/images.js'])
    .concat(['src/anims.js', 'src/portraits_evo.js', 'src/monsters.js', 'src/meta.js', 'src/menu.js', 'src/main.js']);
  window.BUILD = '';
  const start = () => {
    const next = () => { if (!FILES.length) return; const el = document.createElement('script');
      el.src = FILES.shift() + (BUILD ? '?v=' + BUILD : ''); el.onload = next; document.body.appendChild(el); };
    next();
  };
  if (disk) start();
  else fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(j => { BUILD = String(j.v || ''); })
    .catch(() => { BUILD = String(Date.now()); }).then(start);
</script>
</body>
</html>
