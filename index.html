<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Guardlings</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Guardlings">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<script src="vendor/phaser.min.js"></script>
<script src="src/platform.js"></script>
<script src="src/i18n.js"></script>
<script src="src/config.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui.js"></script>
<script src="src/scenery.js"></script>
<script>
  // Картинки: в интернете — отдельными файлами (быстрая загрузка), с диска — встроенные в код
  // (иначе игра не откроется двойным щелчком).
  (location.protocol === 'file:' ? ['sprites', 'portraits', 'art'] : ['images'])
    .forEach(n => document.write('<script src="src/' + n + '.js"><\/script>'));
</script>
<script src="src/anims.js"></script>
<script src="src/portraits_evo.js"></script>
<script src="src/monsters.js"></script>
<script src="src/menu.js"></script>
<script src="src/main.js"></script>

</html>
